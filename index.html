<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Henzo Esteve Aqui 2</title>
	<link rel="stylesheet" href="./style.css">
	<script type="module" src="./index.js" defer></script>
	<script type="module" src="./functions/themes.js" defer></script>
</head>
<body>
	<div id="sites">
		<div class="cont inicio">
			<h1 id="title">Seja Bem-Vindo</h1>
            <div id="container" class="container">
				<button id="btn1">Ver Saldo</button>
				<button id="btn2">Sacar</button>
				<button id="btn3">Depositar</button>
				<button id="btn4">Sair</button>
			</div>
			<div id="functions"></div>
			<p class="error"></p>
        </div>
		<div class="cont form">
			<h1>Olá! Seja Bem Vindo ao Banco do Henzo</h1>
			<div id="functions">
				<div class="lineDiv">
					<input id="yourName" type="text" placeholder="Insira o seu Nome">
					<button id="nameBtn">Enviar</button>
				</div>
			</div>
			<p class="error"></p>

		</div>
    </div>


    <div class="themes">
        <button class="thems " id="thm1" style="background-color: #616160;"></button>
        <button class="thems " id="thm2" style="background-color: #e8541f;"></button>
        <button class="thems " id="thm3" style="background-color: #fcfcfc;"></button>
        <button class="thems selected" id="thm4" style="background-color: rgb(82, 22, 233)"></button>
    </div>
</body>
</html>
